<svg width="64" height="64" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="titulo-visao" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><title id="titulo-visao">Ilustração de um sol nascendo no horizonte, representando a visão de futuro até 2030</title><defs><style>
      .c1 { fill: #2D5F3E; }
      .c2 { fill: #4E7A52; }
      .c3 { fill: #93B378; }
      .accent { fill: #E8A33D; }
    </style></defs><!-- moldura de olho / lente de visão --><path class="c2" d="M20,100 C50,60 150,60 180,100 C150,140 50,140 20,100 Z" fill="none" stroke="#4E7A52" stroke-width="8"/><!-- sol nascendo (o "amanhã") --><clipPath id="lente"><path d="M20,100 C50,60 150,60 180,100 C150,140 50,140 20,100 Z"/></clipPath><g clip-path="url(#lente)"><rect x="0" y="100" width="200" height="60" class="c3"/><circle class="accent" cx="100" cy="100" r="34"/><rect x="0" y="112" width="200" height="6" class="c1" opacity="0.4"/><rect x="0" y="126" width="200" height="6" class="c1" opacity="0.3"/></g><!-- pupila central --><circle class="c1" cx="100" cy="100" r="14"/></svg>
