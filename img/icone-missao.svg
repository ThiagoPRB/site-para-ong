<svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Ícone Missão — educação e crescimento" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <style>
      .c1 { fill: #2D5F3E; }
      .c2 { fill: #4E7A52; }
      .c3 { fill: #93B378; }
      .accent { fill: #E8A33D; }
      .page { fill: #F7F4EE; }
    </style>
  </defs>

  <!-- livro aberto -->
  <path class="c1" d="M20,120 C50,108 80,108 100,120 L100,158 C80,146 50,146 20,158 Z"/>
  <path class="c1" d="M180,120 C150,108 120,108 100,120 L100,158 C120,146 150,146 180,158 Z"/>
  <path class="page" d="M28,124 C52,114 78,114 96,124 L96,150 C78,142 52,142 28,150 Z"/>
  <path class="page" d="M172,124 C148,114 122,114 104,124 L104,150 C122,142 148,142 172,150 Z"/>

  <!-- broto crescendo do centro do livro -->
  <path class="c2" d="M100,120 L100,80" stroke="#4E7A52" stroke-width="6" fill="none" stroke-linecap="round"/>
  <path class="c3" d="M100,90 C80,86 74,66 84,50 C96,66 100,78 100,90 Z"/>
  <path class="c3" d="M100,90 C120,86 126,66 116,50 C104,66 100,78 100,90 Z"/>

  <!-- sol/luz do conhecimento -->
  <circle class="accent" cx="100" cy="38" r="10"/>
</svg>
