<svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Ícone Fundação — desde 2015" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <style>
      .c1 { fill: #2D5F3E; }
      .c2 { fill: #4E7A52; }
      .c3 { fill: #93B378; }
      .accent { fill: #E8A33D; }
    </style>
  </defs>

  <!-- prédio/sede -->
  <rect class="c2" x="60" y="60" width="80" height="70" rx="4"/>
  <path class="c1" d="M52,60 L100,30 L148,60 Z"/>
  <rect class="accent" x="88" y="95" width="24" height="35"/>
  <rect class="c3" x="70" y="72" width="16" height="16"/>
  <rect class="c3" x="114" y="72" width="16" height="16"/>

  <!-- raízes na base -->
  <path class="c1" fill="none" stroke="#2D5F3E" stroke-width="6" stroke-linecap="round"
        d="M100,130 C90,142 72,146 58,158"/>
  <path class="c1" fill="none" stroke="#2D5F3E" stroke-width="6" stroke-linecap="round"
        d="M100,130 C110,142 128,146 142,158"/>
  <path class="c1" fill="none" stroke="#2D5F3E" stroke-width="6" stroke-linecap="round"
        d="M100,130 L100,158"/>

  <!-- selo/ano de fundação -->
