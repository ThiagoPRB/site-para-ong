<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="shortcut icon" href="icons/favicon.ico" target="image/x-icon">
    <title>Raízes do Amanhã | cadastro</title>
</head>
<body>
    <header>
        <div class="logo">
        <img src="imagens/logo-raizes-do-amanha-200x200.png" alt="ícone Raízes do Amanhã">
        <span>Raízes do Amanhã</span>
    </div>
    <nav aria-label="navegação principal">
    <ul>
        <li><a href="index.html" aria-current="page">Inicio</a></li>
        <li><a href="projetos.html">projetos</a></li>
        <li><a href="cadastro.html">cadastro</a></li>
        
    </header>
    
    <main>
        <section>
            <h1>Faça parte da Raízes do Amanhã</h1>
            <p>Preencha o formulário abaixo para se cadastrar como voluntário(a), doador(a) ou parceiro(a).</p>

           <form id="form-cadastro" novalidate></form>

            <fieldset>
                <legend>Dados Pessoais</legend>
            </fieldset>

            <label id="nome"></label>
            <input type="text" id="nome" name="nome" required minlength="3" placeholder="digite seu nome completo">

            <label id="cpf"></label>
            <input type="text" id="cpf" name="cpf" required inputmode="numeric" pattern="\d{3}\.\d{3}\.\d{3}\-\d{2}" maxlenght="14" placeholder="000.000.000-00"> 
            <small class="erro"></small>

            <label id="email"></label>
            <input type="email" id="email" name="email" required placeholder="seuemail@exemplo.com">

            <label id="telefone"></label>
            <input type="number" id="telefone" name="telefone" required inputmode="numeric" pattern="\(\d{2}\)\s\d{4-5}\-\d{4}" maxlength="15" placeholder="(00) 00000-0000">

            <label id="cep"></label>
            <input type="text" id="cep" name="cep" required inputmode="numeric" pattern="\d{5}\-\d{3}" maxlength="9" placeholder="00000-000">

            <select id="tipo-participacao" name="tipo-participacao">
             <option value="">selecione uma das opções</option>
             <option value="voluntariado">Voluntariado</option>
             <option value="doacao-monetaria">Doação Monetaria</option>
             <option value="doacao-materiais">Doação de Materiais</option>
             <option value="parceria-empresarial">Parceria Empresarial</option>
            </select>

            <button type="submit">enviar cadastro</button>
            <p id="mensagem-envio" role="status"></p>

            <footer>
            <hr>
            <p>&copy; 2026 Raízes do Amanhã — contato@raizesdoamanha.org.br</p>
    </footer>

    </main>
</body>
</html>
